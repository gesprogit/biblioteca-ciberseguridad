name: Actualizar biblioteca y vigilar fuentes

on:
  schedule:
    - cron: "0 5 * * 1"   # Lunes 05:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dependencias
        run: pip install --quiet requests beautifulsoup4 lxml

      - name: 1. Scraper AEPD (FAQs completas)
        run: python scripts/scraper_aepd.py

      - name: 2. Vigilar fuentes oficiales
        run: python scripts/vigilar_fuentes.py

      - name: Configurar Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Commit y push
        run: |
          git add data/
          if git diff --staged --quiet; then
            echo "✅ Sin cambios"
          else
            git commit -m "🤖 Actualización automática: AEPD + vigilancia [skip ci]"
            git push
          fi

      - name: Crear etiqueta vigilancia
        run: gh label create vigilancia --color "fbca04" --force || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Abrir issue si hay cambios
        if: hashFiles('data/cambios_detectados.md') != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --title "🚨 Cambio en fuentes — $(date -u +%Y-%m-%d)" \
            --body-file data/cambios_detectados.md \
            --label vigilancia || true
