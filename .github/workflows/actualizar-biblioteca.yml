name: Actualizar biblioteca
on:
  schedule:
    - cron: "0 6 * * 1"   # todos los lunes a las 06:00 UTC
  workflow_dispatch:       # botón para lanzarlo a mano
permissions:
  contents: write
jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v5
      - name: Preparar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Instalar dependencias
        run: pip install --quiet requests beautifulsoup4
      - name: Actualizar FAQs AEPD en HTML
        run: python scripts/actualizar_aepd_html.py
      - name: Confirmar cambios (si los hay)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "Sin cambios en las fuentes."
          else
            git commit -m "🤖 Actualización automática FAQs AEPD [skip ci]"
            git push
          fi
